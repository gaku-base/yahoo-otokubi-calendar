name: v081 store search branch check
on:
  push:
    branches: [chapi-v081-store-search]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/v081-store-search-check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair exact search-button typo if present
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/app.js');s=p.read_text(encoding='utf-8')
          bad="$('#searchBtn'].click()"; good="$('#searchBtn').click()"
          if bad in s: p.write_text(s.replace(bad,good),encoding='utf-8')
          assert bad not in p.read_text(encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js
          git commit -m "v0.8.1: fix search button syntax"
          git push origin HEAD:chapi-v081-store-search
      - run: node --check docs/core.js
      - run: node --check docs/app.js
      - run: node --check docs/sw.js
      - run: node tests/test_core.js
      - run: python tests/check_package.py
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build local client data
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
          cp data/status.json docs/data/status.json
      - name: Start local PWA
        run: |
          python -m http.server 8000 --directory docs >/tmp/otokubi-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/otokubi-http.log
          exit 1
      - name: Run iPhone Windows alias smoke
        env:
          SMOKE_URL: http://127.0.0.1:8000/
        run: python tests/smoke_pwa.py

name: v0.9.2 campaign DOM inspect
on:
  push:
    branches: [chapi-v092-auto-campaign]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/inspect_campaign_pages.py

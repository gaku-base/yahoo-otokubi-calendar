name: v0.8.9 branch validation
on:
  push:
    branches: [chapi-v089-clicked-day-info]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tests/check_package.py
      - run: node --check docs/rank.js && node --check docs/manual_refresh.js && node --check docs/sw.js && node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Build local site
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
          cp data/status.json docs/data/status.json
          python -m http.server 8000 --directory docs >/tmp/site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Run iPhone and Windows smoke with clicked-day detail checks
        env:
          SMOKE_URL: http://127.0.0.1:8000/
        run: python tests/smoke_pwa.py

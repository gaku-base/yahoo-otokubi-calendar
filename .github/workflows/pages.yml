name: Deploy iPhone PWA to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check docs/core.js
          node --check docs/app.js
          node --check docs/sw.js
          node tests/test_core.js
      - name: Validate PWA package
        run: python tests/check_package.py
      - name: Validate source JSON files
        run: python -m json.tool data/bonus.json >/dev/null && python -m json.tool data/campaigns.json >/dev/null
      - name: Build compact client data
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
      - name: Validate published data budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/bonus.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('format')=='indexed-v1'
          assert d.get('version')=='0.7.2'
          assert d.get('validation',{}).get('ok') is True
          assert p.stat().st_size < 6*1024*1024
          assert len(d.get('days',[]))>0 and len(d.get('store_catalog',[]))>0
          print('Pages client data: PASS',p.stat().st_size)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy iPhone PWA to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check docs/core.js
          node --check docs/app.js
          node --check docs/rank.js
          node --check docs/manual_refresh.js
          node --check docs/calc_assumptions.js
          node --check docs/sunday_start.js
          node --check docs/campaign_ui.js
          node --check docs/sw.js
          node tests/test_core.js
      - name: Validate campaign metadata rules
        run: |
          python tests/test_campaign_meta.py
          python tests/test_guide_campaigns.py
      - name: Validate PWA package
        run: python tests/check_package.py
      - name: Validate source JSON files
        run: python -m json.tool data/bonus.json >/dev/null && python -m json.tool data/campaigns.json >/dev/null && python -m json.tool data/status.json >/dev/null
      - name: Build compact client data
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
          cp data/status.json docs/data/status.json
      - name: Validate published data budget and status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/bonus.json'); d=json.loads(p.read_text(encoding='utf-8')); s=json.loads(Path('docs/data/status.json').read_text(encoding='utf-8'))
          assert d.get('format')=='indexed-v1' and d.get('version')=='0.8.0'
          assert d.get('validation',{}).get('ok') is True
          counts=d.get('validation',{}).get('counts',{})
          assert counts.get('partial')==0 and counts.get('bad')==0 and counts.get('count_warnings')==0,counts
          assert counts.get('category_audit_issues',0)==0 and counts.get('multi_rate_conflicts',0)==0,counts
          assert p.stat().st_size < 6*1024*1024 and len(d.get('days',[]))>0 and len(d.get('store_catalog',[]))>0
          assert s.get('version')=='0.8.0' and 'last_attempt_ok' in s
          print('Pages v0.8.0 client/status: PASS',p.stat().st_size,s.get('last_attempt_ok'))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: v0.9.2 branch validation
on:
  push:
    branches: [chapi-v092-auto-campaign]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: v092-branch-validation
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Package and unit tests
        run: |
          python tests/check_package.py
          python tests/test_campaign_meta.py
          python tests/test_guide_campaigns.py
          node --check docs/core.js
          node --check docs/app.js
          node --check docs/rank.js
          node --check docs/campaign_ui.js
          node --check docs/sw.js
          node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Verify current Yahoo official campaign semantics
        run: |
          python - <<'PY'
          import asyncio,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from playwright.async_api import async_playwright
          from calendar_campaigns import collect_calendar
          from campaign_meta import enrich_campaign_rows,DETAIL_URLS
          from guide_campaigns import collect_target_guide
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox']);c=await b.new_context(locale='ja-JP',timezone_id='Asia/Tokyo')
              page=await c.new_page();cal=await collect_calendar(page);meta=await c.new_page();rows,diag=await enrich_campaign_rows(meta,cal.get('campaigns',[]))
              assert rows and not diag.get('errors'),diag
              guide_page=await c.new_page();guide=await collect_target_guide(guide_page);assert not guide.get('errors'),guide
              gp2=next(x for x in guide['campaigns'] if x.get('rate')==2);gp3=next(x for x in guide['campaigns'] if x.get('rate')==3)
              assert '2026-08-18' in gp2['dates'] and '2026-08-31' in gp2['dates'],gp2
              assert '2026-08-18' in gp3['dates'] and '2026-08-31' in gp3['dates'],gp3
              lottery=[r for r in rows if 'くじ' in r.get('title','') or '抽選' in r.get('title','')]
              assert lottery and all(r.get('informational') and r.get('calculation_mode')=='lottery' for r in lottery),lottery
              d=await c.new_page();await d.goto(DETAIL_URLS['bsplus'],wait_until='domcontentloaded',timeout=45000);text=(await d.locator('body').inner_text()).replace('\n',' ');assert '本ページに掲載されているストア' in text and 'さらに+2%' in text
              for key in ('premium_sunday','thanks'):
                x=await c.new_page();await x.goto(DETAIL_URLS[key],wait_until='domcontentloaded',timeout=45000);t=(await x.locator('body').inner_text()).replace('\n',' ');assert 'BONUSを含むアイコン' in t
              await b.close()
              print('Yahoo official campaign semantics: PASS',len(rows),len(lottery),len(gp2['dates']),len(gp3['dates']))
          asyncio.run(main())
          PY
      - name: Full live Yahoo refresh integration
        run: |
          python scripts/scrape_v075.py
          python - <<'PY'
          import json
          b=json.load(open('data/bonus.json',encoding='utf-8'));c=json.load(open('data/campaigns.json',encoding='utf-8'))
          assert b['validation']['ok'] and c['validation']['ok'],(b.get('validation'),c.get('validation'))
          assert not b['validation']['counts'].get('partial') and not b['validation']['counts'].get('bad')
          plus2=next(x for x in c['campaigns'] if 'ボーナスストアPlusでさらに+2' in x.get('title',''))
          plus3=next(x for x in c['campaigns'] if '優良ストア' in x.get('title',''))
          assert plus2.get('eligibility_mode')=='bonus_store_day' and '2026-08-18' in plus2['dates'] and '2026-08-31' in plus2['dates'],plus2
          assert plus3.get('eligibility_mode')=='excellent_store_unknown' and '2026-08-18' in plus3['dates'] and '2026-08-31' in plus3['dates'],plus3
          lottery=[x for x in c['campaigns'] if 'くじ' in x.get('title','') or '抽選' in x.get('title','')]
          assert lottery and all(x.get('informational') and x.get('calculation_mode')=='lottery' for x in lottery),lottery
          day=next(x for x in b['days'] if x['date']=='2026-08-17');assert any(s.get('slug')=='tplink' and float(s.get('rate'))==5 for s in day.get('stores',[]))
          print('Full live refresh integration: PASS',b['validation']['counts'])
          PY
      - name: Build local site
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
          cp data/status.json docs/data/status.json
          python -m http.server 8000 --directory docs >/tmp/site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Run iPhone and Windows smoke
        env:
          SMOKE_URL: http://127.0.0.1:8000/
        run: python tests/smoke_pwa.py

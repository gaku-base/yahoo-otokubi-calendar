name: v0.9.2 branch validation
on:
  push:
    branches: [chapi-v092-auto-campaigns]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Package integrity
        run: python tests/check_package.py
      - name: Campaign parser unit tests
        run: |
          python - <<'PY'
          import runpy
          d=runpy.run_path('tests/test_calendar_campaigns.py')
          tests=[(k,v) for k,v in d.items() if k.startswith('test_') and callable(v)]
          for name,fn in tests:
              fn(); print(name, 'PASS')
          assert tests
          PY
      - name: JavaScript checks
        run: |
          node --check docs/core.js
          node --check docs/app.js
          node --check docs/rank.js
          node --check docs/date_rule.js
          node --check docs/manual_refresh.js
          node --check docs/calc_assumptions.js
          node --check docs/sunday_start.js
          node --check docs/sw.js
          node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Live Yahoo official calendar parse
        run: |
          python - <<'PY'
          import asyncio,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from playwright.async_api import async_playwright
          from calendar_campaigns import collect_calendar
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page(locale='ja-JP')
                  data=await collect_calendar(page)
                  await b.close()
              assert not data['errors'],data
              rows=data['campaigns']; assert rows
              p2=[x for x in rows if 'ボーナスストアPlusでさらに+2%' in x['title']]
              assert p2 and all(x.get('eligibility_rule')=='bonus_plus_member' for x in p2),p2
              for x in rows:
                  if any(k in x['title'] for k in ('くじ','クーポン','抽選')):
                      assert x.get('informational') is True,x
              print('live official calendar: PASS',len(rows),'events')
          asyncio.run(main())
          PY
      - name: Build local site
        run: |
          mkdir -p docs/data
          python scripts/compact_client_data.py --input data/bonus.json --output docs/data/bonus.json
          cp data/campaigns.json docs/data/campaigns.json
          cp data/status.json docs/data/status.json
          python -m http.server 8000 --directory docs >/tmp/site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Run iPhone and Windows smoke
        env:
          SMOKE_URL: http://127.0.0.1:8000/
        run: python tests/smoke_pwa.py

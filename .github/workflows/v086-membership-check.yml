name: v086 date membership check
on:
  push:
    branches: [chapi-v086-date-membership]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Map selectors to Yahoo event lists
        run: |
          python - <<'PY'
          import json, asyncio, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import scrape_v066 as base
          from playwright.async_api import async_playwright
          d=json.loads(Path('data/bonus.json').read_text(encoding='utf-8'))
          day=next(x for x in d['days'] if x['date']=='2026-08-18')
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page(locale='ja-JP')
                  await page.goto(day['url'],wait_until='domcontentloaded',timeout=60000);await page.wait_for_timeout(700)
                  n=await page.locator('select').count();print('selects',n)
                  for i in range(n):
                      s=page.locator('select').nth(i)
                      meta=await s.evaluate(r'''s=>({html:s.outerHTML,attrs:Object.fromEntries([...s.attributes].map(a=>[a.name,a.value])),parent:s.parentElement?.outerHTML?.slice(0,1500)||''})''')
                      opt=await s.locator('option').filter(has_text='キッチン、日用品、文具').first.get_attribute('value')
                      txt=await s.locator('option').filter(has_text='キッチン、日用品、文具').first.inner_text()
                      print('SELECT',i,'option',txt,'value',opt,'meta',json.dumps(meta,ensure_ascii=False)[:5000])
                      await s.select_option(value=opt);await page.wait_for_timeout(900)
                      lists=await page.evaluate(r'''() => [...document.querySelectorAll('ul[id*="storeList"]')].map(u=>({id:u.id,count:u.querySelectorAll('a.elStoreLink').length,display:getComputedStyle(u).display,rects:u.getClientRects().length,hasTplink:[...u.querySelectorAll('a.elStoreLink')].some(a=>(a.href||'').includes('/tplink/')),first:[...u.querySelectorAll('a.elStoreLink')].slice(0,3).map(a=>(a.innerText||'').trim())}))''')
                      print('AFTER',i,json.dumps(lists,ensure_ascii=False))
                  await b.close()
          asyncio.run(main())
          PY

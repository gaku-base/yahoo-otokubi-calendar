name: v086 date membership check
on:
  push:
    branches: [chapi-v086-date-membership]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect list container boundaries
        run: |
          python - <<'PY'
          import json, asyncio, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import scrape_v066 as base
          from playwright.async_api import async_playwright
          d=json.loads(Path('data/bonus.json').read_text(encoding='utf-8'))
          day=next(x for x in d['days'] if x['date']=='2026-08-18')
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page(locale='ja-JP')
                  await page.goto(day['url'],wait_until='domcontentloaded',timeout=60000);await page.wait_for_timeout(700)
                  metas=[m for m in await base.select_meta(page) if m.get('rate') is not None]
                  print('metas',json.dumps(metas,ensure_ascii=False)[:12000])
                  m=next(x for x in metas if float(x['rate'])==5.0)
                  opt=next(o for o in m['options'] if 'キッチン、日用品、文具' in o.get('text',''))
                  await base.choose_option(page,m['index'],opt);await page.wait_for_timeout(800)
                  info=await page.evaluate(r'''() => {
                    const a=[...document.querySelectorAll('a')].find(x=>(x.href||'').includes('store.shopping.yahoo.co.jp/tplink'));
                    if(!a)return null;
                    let ancestors=[],p=a;
                    for(let i=0;i<12&&p;i++,p=p.parentElement){ancestors.push({tag:p.tagName,id:p.id||'',cls:String(p.className||''),text:(p.innerText||'').replace(/\s+/g,' ').trim().slice(0,260)})}
                    const all=[...document.querySelectorAll('h1,h2,h3,h4,h5,h6,select,a')];const ix=all.indexOf(a);return {anchor:{text:(a.innerText||'').trim(),href:a.href},ancestors,before:all.slice(Math.max(0,ix-12),ix).map(x=>({tag:x.tagName,text:(x.innerText||'').replace(/\s+/g,' ').trim().slice(0,100),href:x.href||'',id:x.id||'',cls:String(x.className||'')})),after:all.slice(ix+1,ix+8).map(x=>({tag:x.tagName,text:(x.innerText||'').replace(/\s+/g,' ').trim().slice(0,100),href:x.href||'',id:x.id||'',cls:String(x.className||'')}))};
                  }''')
                  print('tplink context',json.dumps(info,ensure_ascii=False,indent=2)[:30000])
                  # Dump ancestry of the +5 select for comparison.
                  sinfo=await page.locator('select').nth(m['index']).evaluate(r'''s=>{let out=[],p=s;for(let i=0;i<10&&p;i++,p=p.parentElement)out.push({tag:p.tagName,id:p.id||'',cls:String(p.className||''),text:(p.innerText||'').replace(/\s+/g,' ').trim().slice(0,300)});return out}''')
                  print('select ancestry',json.dumps(sinfo,ensure_ascii=False,indent=2)[:15000])
                  await b.close()
          asyncio.run(main())
          PY

name: v086 date membership check
on:
  push:
    branches: [chapi-v086-date-membership]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Trace TP-Link membership source
        run: |
          python - <<'PY'
          import json, asyncio, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import scrape_v074 as strict
          from playwright.async_api import async_playwright
          d=json.loads(Path('data/bonus.json').read_text(encoding='utf-8'))
          day=next(x for x in d['days'] if x['date']=='2026-08-18')
          print('stored url',day['url'])
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  ctx=await b.new_context(locale='ja-JP',timezone_id='Asia/Tokyo')
                  page=await ctx.new_page()
                  rec=await strict.collect_event(page,'2026-08-18',day['url'],day.get('label',''))
                  hits=[s for s in rec.get('stores',[]) if s.get('slug')=='tplink']
                  print('fresh status',rec.get('status'),'tplink hits',json.dumps(hits,ensure_ascii=False,indent=2))
                  print('failures',json.dumps(rec.get('diagnostics',{}).get('failures',[]),ensure_ascii=False)[:4000])
                  print('sections',json.dumps(rec.get('diagnostics',{}).get('sections',[]),ensure_ascii=False)[:8000])
                  await b.close()
          asyncio.run(main())
          PY

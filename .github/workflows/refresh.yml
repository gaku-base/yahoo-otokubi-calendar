name: Refresh Yahoo Shopping data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '18 3,9,15,21 * * *'
concurrency:
  group: yahoo-data-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python tests/check_package.py
      - run: node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Scrape every listed BONUS+ day/category and official point calendar
        run: python scripts/scrape_v075.py
      - name: Upload full scrape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-shopping-scrape-${{ github.run_id }}
          path: data/*.json
          retention-days: 14
      - name: Compact client BONUS+ data
        if: success()
        run: python scripts/compact_client_data.py
      - name: Validate client and campaign data
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/bonus.json'); d=json.loads(p.read_text(encoding='utf-8'))
          c=json.loads(Path('data/campaigns.json').read_text(encoding='utf-8'))
          assert d.get('version')=='0.7.5'
          assert d.get('format')=='indexed-v1'
          assert d.get('validation',{}).get('ok') is True
          counts=d['validation'].get('counts',{})
          assert counts.get('partial')==0 and counts.get('bad')==0 and counts.get('count_warnings')==0, counts
          assert counts.get('category_audit_issues')==0 and counts.get('multi_rate_conflicts')==0, counts
          assert counts.get('days',0)>0 and counts.get('categories',0)>0 and counts.get('stores',0)>0, counts
          assert counts.get('recovered_days',0)>=0 and counts.get('recovery_attempts',0)>=0, counts
          assert len(d.get('days',[]))>0 and len(d.get('store_catalog',[]))>0
          assert len({x['date'] for x in d['days']})==len(d['days'])
          assert c.get('version')=='0.7.5'
          assert 'dailybonus/calendar' in (c.get('source') or '')
          assert c.get('validation',{}).get('ok') is True and c.get('campaigns')
          assert not c.get('errors'), c.get('errors')
          titles=[x.get('title','') for x in c['campaigns']]
          assert not any(any(noise in title for noise in ('クーポン','くじ','抽選','対象商品購入')) for title in titles)
          assert sum('Brand Week' in title or 'ブランドウィーク' in title for title in titles) <= 1, titles
          by={x['date']:x for x in d['days']}; catalog=d['store_catalog']
          if '2026-08-17' in by:
              assert any((catalog[sid][1] if len(catalog[sid])>1 else '')=='tplink' and float(rate)==5 for sid,rate in by['2026-08-17']['offers']), 'TP-Link 2026-08-17 +5% missing while historical day is still listed'
          assert p.stat().st_size < 6*1024*1024
          print('v0.7.5 safe-recovery data: PASS',p.stat().st_size,'counts',json.dumps(counts,ensure_ascii=False),'campaigns',len(c['campaigns']))
          PY
      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonus.json data/campaigns.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Yahoo Shopping campaigns"
          git pull --rebase origin main
          git push origin HEAD:main

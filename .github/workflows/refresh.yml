name: Refresh Yahoo Shopping data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '18 3,9,15,21 * * *'
concurrency:
  group: yahoo-data-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python tests/check_package.py
      - run: node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Scrape every listed BONUS+ day/category and official point calendar
        run: python scripts/scrape_v071.py
      - name: Upload full scrape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-shopping-scrape-${{ github.run_id }}
          path: data/*.json
          retention-days: 14
      - name: Compact client BONUS+ data
        if: success()
        run: python scripts/compact_client_data.py
      - name: Validate client and campaign data
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/bonus.json'); d=json.loads(p.read_text(encoding='utf-8'))
          c=json.loads(Path('data/campaigns.json').read_text(encoding='utf-8'))
          assert d.get('version')=='0.7.1'
          assert d.get('format')=='indexed-v1'
          assert d.get('validation',{}).get('ok') is True
          assert len(d.get('days',[]))>0 and len(d.get('store_catalog',[]))>0
          assert len({x['date'] for x in d['days']})==len(d['days'])
          assert c.get('version')=='0.7.1'
          assert 'dailybonus/calendar' in (c.get('source') or '')
          assert c.get('validation',{}).get('ok') is True and c.get('campaigns')
          assert not c.get('errors'), c.get('errors')
          assert not any(any(noise in x.get('title','') for noise in ('クーポン','くじ','抽選','対象商品購入')) for x in c['campaigns'])
          by={x['date']:x for x in d['days']}; catalog=d['store_catalog']
          if '2026-08-17' in by:
              hit=[]
              for sid,rate in by['2026-08-17']['offers']:
                  row=catalog[sid]
                  if len(row)>1 and row[1]=='tplink' and float(rate)==5: hit.append((sid,rate))
              assert hit, 'TP-Link 2026-08-17 +5% missing while historical day is still listed'
          assert p.stat().st_size < 6*1024*1024
          print('v0.7.1 client/calendar data: PASS',p.stat().st_size,'catalog',len(catalog),'offers',sum(len(x.get('offers',[])) for x in d['days']),'campaigns',len(c['campaigns']))
          PY
      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonus.json data/campaigns.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Yahoo Shopping campaigns"
          git pull --rebase origin main
          git push origin HEAD:main

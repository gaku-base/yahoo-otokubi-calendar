name: Refresh Yahoo Shopping data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '18 3,9,15,21 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python tests/check_package.py
      - run: node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Scrape every listed BONUS+ day and category
        run: python scripts/scrape_v062.py
      - name: Upload full scrape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-shopping-scrape-${{ github.run_id }}
          path: data/*.json
          retention-days: 14
      - name: Compact client BONUS+ data
        if: success()
        run: python scripts/compact_client_data.py
      - name: Validate compact client data
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/bonus.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version')=='0.6.4'
          assert d.get('format')=='indexed-v1'
          assert d.get('validation',{}).get('ok') is True
          assert len(d.get('days',[]))>0 and len(d.get('store_catalog',[]))>0
          by={x['date']:x for x in d['days']}
          catalog=d['store_catalog']
          hit=[]
          for sid,rate in by['2026-08-17']['offers']:
              row=catalog[sid]
              if len(row)>1 and row[1]=='tplink' and float(rate)==5: hit.append((sid,rate))
          assert hit, 'TP-Link 2026-08-17 +5% missing after indexed compaction'
          assert p.stat().st_size < 8*1024*1024
          print('indexed client data: PASS', p.stat().st_size, 'catalog',len(catalog),'offers',sum(len(x.get('offers',[])) for x in d['days']))
          PY
      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonus.json data/campaigns.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Yahoo Shopping campaigns"
          git push

name: Refresh Yahoo Shopping data
on:
  workflow_dispatch:
  schedule:
    - cron: '18 3,9,15,21 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: node tests/test_core.js
      - run: python -m playwright install --with-deps chromium
      - name: Scrape and validate Yahoo Shopping
        run: python scripts/scrape.py
      - name: Upload scraped data for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-shopping-scrape-${{ github.run_id }}
          path: data/*.json
          retention-days: 14
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonus.json data/campaigns.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Yahoo Shopping campaigns"
          git push
